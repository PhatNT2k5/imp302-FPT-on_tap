<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/katex/dist/katex.min.css">
<script src="vendor/katex/dist/katex.min.js"></script>
<script src="vendor/katex/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #111c18; --surface: #1b2a22; --ink: #e4eee1; --muted: #8fa392;
    --accent: #a9c995; --orange: #edb78e; --line: #35463a; --fit: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  body { font-family: "Segoe UI", sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1280px; height: 720px; padding: 24px 48px 0; display: flex; flex-direction: column; }
  .chapter { font-size: 17px; font-weight: 600; color: var(--accent); letter-spacing: .02em; height: 26px; flex: none; }
  .head { flex: none; padding: 6px 0 12px; max-height: 118px; overflow: hidden; }
  .kicker { display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
            color: var(--bg); background: var(--orange); border-radius: 5px; padding: 2px 10px; margin-bottom: 6px; }
  h1 { font-size: 35px; line-height: 1.2; font-weight: 700; }
  h1.long { font-size: 29px; }
  .body { flex: 1; min-height: 0; display: flex; gap: 30px; padding-bottom: 14px; }
  .media { flex: none; width: 700px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
           padding: 12px 12px 34px; position: relative; display: flex; align-items: center; justify-content: center; }
  .media.narrow { width: 500px; }
  .media img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .media span { position: absolute; left: 14px; bottom: 9px; font-size: 15px; color: var(--muted); }
  .content { flex: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
             gap: calc(16px * var(--fit)); font-size: calc(26px * var(--fit)); padding-top: 4px; }
  .content.beside { font-size: calc(21px * var(--fit)); }
  .hidden { visibility: hidden; }

  .formula { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
             padding: calc(12px * var(--fit)) 18px; font-size: calc(1.08em); text-align: center; flex: none; }
  .formula .katex-display { margin: 0; }
  .formula .katex { color: var(--ink); }

  ul.bullets { list-style: none; display: flex; flex-direction: column; gap: calc(13px * var(--fit)); flex: none; }
  ul.bullets li { position: relative; padding-left: 24px; line-height: 1.38; color: var(--muted); }
  ul.bullets li::before { content: ""; position: absolute; left: 0; top: .28em; bottom: .28em; width: 5px;
                          border-radius: 3px; background: var(--line); }
  ul.bullets li.current { color: var(--ink); }
  ul.bullets li.current::before { background: var(--accent); }

  table { border-collapse: collapse; width: 100%; font-size: .84em; flex: none; }
  th { text-align: left; color: var(--accent); font-weight: 600; border-bottom: 2px solid var(--line); padding: 6px 12px; }
  td { padding: calc(8px * var(--fit)) 12px; border-bottom: 1px solid var(--line); color: var(--muted); line-height: 1.3; vertical-align: top; }
  td:first-child { font-weight: 600; }
  tr.current td { color: var(--ink); background: #24382c; }
  tr.current td:first-child { box-shadow: inset 5px 0 0 var(--accent); }

  pre.code { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; flex: none;
             font-family: "Cascadia Mono", Consolas, monospace; font-size: .8em; line-height: 1.5; white-space: pre; overflow: hidden; }
  pre.code div { padding: 1px 18px 1px 0; color: var(--muted); }
  pre.code div.current { color: var(--ink); background: #24382c; box-shadow: inset 5px 0 0 var(--accent); }
  pre.code i { display: inline-block; width: 52px; text-align: right; padding-right: 16px; font-style: normal; color: #5f7565; }

  .grids { display: flex; gap: 34px; align-items: flex-start; flex-wrap: wrap; flex: none; }
  .gridbox { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .gridbox b { font-size: .72em; font-weight: 600; color: var(--muted); }
  .gridbox.current b { color: var(--accent); }
  .grid { display: grid; gap: 3px; }
  .grid div { width: var(--cell); height: var(--cell); display: flex; align-items: center; justify-content: center;
              background: var(--surface); border: 1px solid var(--line); border-radius: 4px; font-size: var(--cellfont);
              font-variant-numeric: tabular-nums; color: var(--ink); }
  .grid div.accent { background: #3d5a3a; border-color: var(--accent); color: #fff; font-weight: 600; }
  .grid div.warn { background: #6a4a32; border-color: var(--orange); color: #fff; font-weight: 600; }
  .grid div.dim { color: #5f7565; }

  .intro h2 { font-size: 34px; font-weight: 600; color: var(--orange); margin-top: 56px; }
  .intro h1 { font-size: 62px; line-height: 1.15; margin-top: 4px; }
  .intro p { font-size: 22px; color: var(--muted); margin: 34px 0 14px; }
  .agenda { display: grid; grid-auto-flow: column; column-gap: 40px; row-gap: calc(12px * var(--fit));
            font-size: calc(22px * var(--fit)); line-height: 1.3; }
  .agenda div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda i { font-style: normal; color: var(--muted); margin-right: 12px; font-variant-numeric: tabular-nums; }

  .head { position: relative; }
  .ask { position: absolute; right: 0; top: 8px; font-size: 17px; font-weight: 700; color: var(--bg);
         background: var(--orange); border-radius: 999px; padding: 6px 16px; }
  .split { flex: 1; min-height: 0; display: flex; gap: 28px; }
  .split > .visual { flex: 1.55; }
  .split > ul.bullets { flex: 1; font-size: .86em; align-self: center; }
  .visual { flex: 1; min-height: 200px; position: relative; }
  .visual svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .visual .cap { position: absolute; left: 0; bottom: 0; font-size: 15px; color: var(--muted); }
  svg text { font-family: "Segoe UI", sans-serif; fill: var(--ink); }
  svg .muted { fill: var(--muted); }
  .compare { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 22px; }
  .compare .panel { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .compare .panel b { font-size: .8em; color: var(--accent); font-weight: 600; }
  .compare .panel .visual { width: 100%; }
  .compare .panel img { max-width: 100%; max-height: 380px; object-fit: contain; border-radius: 8px; }
  .compare .arrow { align-self: center; display: flex; flex-direction: column; align-items: center; color: var(--orange);
                    font-size: .72em; max-width: 170px; text-align: center; gap: 4px; }
  .compare .arrow i { font-style: normal; font-size: 2.2em; line-height: 1; }
  .chain { display: flex; flex-wrap: wrap; gap: 14px 8px; align-items: center; font-size: .8em; flex: none; }
  .chain span { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .chain span.done { color: var(--ink); }
  .chain span.done::before { content: "✓ "; color: var(--accent); }
  .chain span.current { background: #3d5a3a; border-color: var(--accent); color: #fff; font-weight: 700; }
  .chain i { font-style: normal; color: var(--line); }
  .foot { flex: none; height: 44px; position: relative; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); }
  .bar div { height: 4px; border-radius: 2px; background: var(--accent); }
  .foot span { position: absolute; top: 12px; font-size: 14px; color: var(--muted); }
  .foot .right { right: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const MATH = { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: true };
const FIT_STEPS = [1, 0.93, 0.86, 0.8, 0.74];

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

/* ---------- staged visuals (drawn as SVG once the holder has its final size) ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
const COLORS = { fill: "#1b2a22", line: "#35463a", ink: "#e4eee1", muted: "#8fa392", accent: "#a9c995",
                 accentFill: "#3d5a3a", orange: "#edb78e", warnFill: "#6a4a32" };

function svg(tag, attrs = {}, text) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) node.setAttribute(k, v);
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function look(item) {
  const s = item.style;
  return {
    fill: s === "accent" ? COLORS.accentFill : s === "warn" ? COLORS.warnFill : COLORS.fill,
    stroke: item.current ? COLORS.accent : s === "accent" ? COLORS.accent : s === "warn" || s === "cut" ? COLORS.orange : COLORS.line,
    width: item.current ? 4 : s ? 2.5 : 1.5,
    opacity: !item.visible ? 0 : s === "dim" ? 0.35 : 1,
  };
}

function visualHolder(visual) {
  const holder = el("div", "visual");
  holder.visualData = visual;
  if (visual.caption) holder.append(el("span", "cap", visual.caption));
  return holder;
}

function textWidth(text, size) { return String(text).length * size * 0.56; }

function drawGraph(root, v, W, H) {
  const nodes = v.nodes, byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const font = 19, noteRoom = nodes.some(n => n.note) ? 26 : 0, capRoom = v.caption ? 26 : 0;
  const radius = n => n.shape === "dot" ? 8 : n.shape === "box" ? Math.max(textWidth(n.label, font) / 2 + 14, 26) : 27;
  const padX = Math.max(46, ...nodes.map(n => radius(n) + 8)), padY = 46;
  const sx = (W - 2 * padX) / Math.max(maxX - minX, 1e-9), sy = (H - 2 * padY - noteRoom - capRoom) / Math.max(maxY - minY, 1e-9);
  const k = Math.min(maxX > minX ? sx : Infinity, maxY > minY ? sy : Infinity, 1e6);
  const kk = isFinite(k) ? k : 0;
  const offX = (W - (maxX - minX) * kk) / 2, offY = (H - noteRoom - capRoom - (maxY - minY) * kk) / 2;
  const P = n => [offX + (n.x - minX) * kk, offY + (n.y - minY) * kk];
  if (v.arrows) {
    const defs = svg("defs"), marker = svg("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 12, markerHeight: 12, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" });
    marker.append(svg("path", { d: "M0,0 L10,5 L0,10 z", fill: COLORS.muted }));
    defs.append(marker); root.append(defs);
  }
  for (const e of v.edges) {
    const a = byId[e.a], b = byId[e.b], [x1, y1] = P(a), [x2, y2] = P(b), L = look(e);
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    const ra = a.shape === "box" ? 22 : radius(a), rb = b.shape === "box" ? 22 : radius(b);
    const g = svg("g", { opacity: e.style === "dim" && e.visible ? 0.2 : L.opacity });  // superseded edges fade almost out
    g.append(svg("line", { x1: x1 + ux * ra, y1: y1 + uy * ra, x2: x2 - ux * (rb + (v.arrows ? 3 : 0)), y2: y2 - uy * (rb + (v.arrows ? 3 : 0)),
      stroke: e.style || e.current ? L.stroke : COLORS.muted, "stroke-width": L.width, "stroke-dasharray": e.style === "cut" ? "9 7" : null,
      "marker-end": v.arrows ? "url(#arrow)" : null }));
    if (e.label) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = textWidth(e.label, 17) + 14;
      g.append(svg("rect", { x: mx - w / 2, y: my - 13, width: w, height: 26, rx: 6, fill: "#111c18" }));
      g.append(svg("text", { x: mx, y: my + 6, "text-anchor": "middle", "font-size": 17, fill: e.style === "cut" ? COLORS.orange : COLORS.accent, "font-weight": 600 }, e.label));
    }
    root.append(g);
  }
  for (const n of nodes) {
    const [x, y] = P(n), L = look(n), g = svg("g", { opacity: n.style === "dim" && n.visible ? 0.22 : L.opacity }), r = radius(n);
    if (n.shape === "box") g.append(svg("rect", { x: x - r, y: y - 22, width: 2 * r, height: 44, rx: 10, fill: L.fill, stroke: L.stroke, "stroke-width": L.width }));
    else g.append(svg("circle", { cx: x, cy: y, r, fill: n.shape === "dot" ? (n.style === "warn" ? COLORS.orange : n.style === "accent" || n.current ? COLORS.accent : COLORS.muted) : L.fill, stroke: n.shape === "dot" ? "none" : L.stroke, "stroke-width": L.width }));
    if (n.label) g.append(svg("text", n.shape === "dot" ? { x: x + 13, y: y - 10, "font-size": 16, class: "muted" } : { x, y: y + 7, "text-anchor": "middle", "font-size": font, "font-weight": 600 }, n.label));
    if (n.note) g.append(svg("text", { x, y: y + (n.shape === "dot" ? 26 : 50), "text-anchor": "middle", "font-size": 16, class: "muted" }, n.note));
    root.append(g);
  }
}

function drawHistogram(root, v, W, H) {
  const labelled = v.bands.filter(b => b.label).length;
  // Band labels get their own rows above the plot, then a row for the bar values.
  const n = v.bars.length, top = 26 + 22 * labelled + (v.lines.length ? 22 : 0), bottom = 30 + (v.caption ? 26 : 0), left = 8, right = 8;
  const plotW = W - left - right, plotH = H - top - bottom, slot = plotW / n, max = v.top || Math.max(...v.bars.map(b => b.value), 1e-9);
  const X = at => left + at * slot, base = top + plotH;
  let row = 0;
  for (const band of v.bands) {
    const L = look(band), g = svg("g", { opacity: L.opacity }), labelY = 18 + 22 * (band.label ? row++ : labelled);
    g.append(svg("rect", { x: X(band.start), y: labelY + 6, width: X(band.end) - X(band.start), height: base - labelY - 6, rx: 6,
      fill: band.style === "warn" ? COLORS.warnFill : COLORS.accentFill, "fill-opacity": 0.45 }));
    if (band.label) g.append(svg("text", { x: (X(band.start) + X(band.end)) / 2, y: labelY, "text-anchor": "middle", "font-size": 16,
      "font-weight": 600, fill: band.style === "warn" ? COLORS.orange : COLORS.accent }, band.label));
    root.append(g);
  }
  root.append(svg("line", { x1: left, x2: W - right, y1: base, y2: base, stroke: COLORS.line, "stroke-width": 2 }));
  const every = Math.ceil(n / 20);
  v.bars.forEach((b, i) => {
    const L = look(b), h = b.value / max * plotH, w = Math.min(slot * 0.72, 90), x = X(i) + (slot - w) / 2;
    const g = svg("g", { opacity: L.opacity });
    g.append(svg("rect", { x, y: base - h, width: w, height: Math.max(h, 1), rx: 3,
      fill: b.style === "warn" ? COLORS.orange : b.style === "accent" || b.current ? COLORS.accent : "#5f7f68" }));
    if (n <= 16) g.append(svg("text", { x: x + w / 2, y: base - h - 8, "text-anchor": "middle", "font-size": 15, class: "muted" }, String(b.value).replace(".", ",")));
    root.append(g);
    if (i % every === 0) root.append(svg("text", { x: X(i) + slot / 2, y: base + 22, "text-anchor": "middle", "font-size": 15, class: "muted", opacity: L.opacity ? 1 : 0 }, b.label));
  });
  for (const line of v.lines) {
    const L = look(line), x = X(line.at), g = svg("g", { opacity: L.opacity });
    g.append(svg("line", { x1: x, x2: x, y1: top - 4, y2: base + 4, stroke: COLORS.orange, "stroke-width": 3, "stroke-dasharray": "8 6" }));
    g.append(svg("text", { x, y: top - 12, "text-anchor": "middle", "font-size": 17, "font-weight": 700, fill: COLORS.orange }, line.label));
    root.append(g);
  }
}

function fmt(x) { return String(Math.round(x * 1e6) / 1e6).replace(".", ","); }

function drawIntervals(root, v, W, H) {
  const rows = v.rows, capRoom = v.caption ? 26 : 0, left = 10, right = 10;
  const rowH = Math.min(92, (H - capRoom) / rows.length), barH = Math.min(36, rowH * 0.45), plotW = W - left - right;
  rows.forEach((row, i) => {
    const y = i * rowH + 26, L = look(row), g = svg("g", { opacity: L.opacity });
    const X = t => left + (t - row.low) / (row.high - row.low) * plotW;
    for (const [name, a, b] of row.parts) {
      const picked = name === row.pick, x = X(a), w = X(b) - X(a);
      g.append(svg("rect", { x, y, width: w, height: barH, fill: picked ? COLORS.accentFill : COLORS.fill,
        stroke: picked ? COLORS.accent : COLORS.line, "stroke-width": picked ? 3 : 1.5 }));
      if (w > textWidth(name, 16) + 6) g.append(svg("text", { x: x + w / 2, y: y + barH / 2 + 6, "text-anchor": "middle", "font-size": 16, "font-weight": picked ? 700 : 400 }, name));
    }
    g.append(svg("text", { x: left, y: y - 7, "font-size": 15, class: "muted" }, fmt(row.low)));
    g.append(svg("text", { x: W - right, y: y - 7, "text-anchor": "end", "font-size": 15, class: "muted" }, fmt(row.high)));
    const next = rows[i + 1], pick = row.parts.find(p => p[0] === row.pick);
    if (pick && next && next.visible) {
      const ny = (i + 1) * rowH + 26;
      for (const [from, to] of [[X(pick[1]), left], [X(pick[2]), W - right]])
        g.append(svg("line", { x1: from, y1: y + barH, x2: to, y2: ny, stroke: COLORS.accent, "stroke-width": 1.5, "stroke-dasharray": "5 5", opacity: 0.8 }));
    }
    root.append(g);
  });
}

function drawVisuals(stage) {
  for (const holder of stage.querySelectorAll(".visual")) {
    const v = holder.visualData;
    holder.querySelector("svg")?.remove();
    const W = holder.clientWidth, H = holder.clientHeight;
    const root = svg("svg", { viewBox: `0 0 ${W} ${H}` });
    if (v.type === "graph") drawGraph(root, v, W, H);
    else if (v.type === "histogram") drawHistogram(root, v, W, H);
    else if (v.type === "intervals") drawIntervals(root, v, W, H);
    holder.prepend(root);
  }
}

function buildPanel(panel, visible) {
  const box = el("div", "panel" + (visible ? "" : " hidden"));
  if (panel.grid) box.append(buildGrids([panel.grid]));
  else if (panel.histogram) box.append(visualHolder({ type: "histogram", ...panel.histogram }));
  else { const img = el("img"); img.src = panel.image; box.append(img); }
  box.append(el("b", "", panel.label));
  return box;
}

function buildVisual(v) {
  if (v.type === "chain") {
    const chain = el("div", "chain");
    v.items.forEach((item, i) => {
      if (i) chain.append(el("i", "", "→"));
      chain.append(el("span", i + 1 === v.current ? "current" : i + 1 < v.current ? "done" : "", item));
    });
    return chain;
  }
  if (v.type === "compare") {
    const wrap = el("div", "compare");
    const arrow = el("div", "arrow" + (v.showRight ? "" : " hidden"));
    arrow.append(el("i", "", "→"), el("span", "", v.arrow));
    wrap.append(buildPanel(v.left, v.showLeft), arrow, buildPanel(v.right, v.showRight));
    return wrap;
  }
  return visualHolder(v);
}

function buildBullets(bullets) {
  const list = el("ul", "bullets");
  for (const b of bullets) list.append(el("li", b.visible ? (b.current ? "current" : "") : "hidden", b.text));
  return list;
}

function buildGrids(grids) {
  const wrap = el("div", "grids");
  for (const g of grids) {
    const cols = g.cells[0].length;
    const size = cols <= 4 ? 62 : cols <= 6 ? 52 : 44;
    const box = el("div", "gridbox" + (g.visible ? (g.current ? " current" : "") : " hidden"));
    const grid = el("div", "grid");
    grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    grid.style.setProperty("--cell", `calc(${size}px * var(--fit))`);
    grid.style.setProperty("--cellfont", `calc(${Math.round(size * 0.36)}px * var(--fit))`);
    g.cells.forEach((row, r) => row.forEach((value, c) => grid.append(el("div", g.marks[`${r},${c}`] || "", value))));
    box.append(grid);
    if (g.label) box.append(el("b", "", g.label));
    wrap.append(box);
  }
  return wrap;
}

function buildContent(state) {
  const content = el("div", "content" + (state.media ? " beside" : ""));
  if (state.formula) {
    const box = el("div", "formula");
    katex.render(state.formula, box, { displayMode: true, throwOnError: true });
    content.append(box);
  }
  const v = state.visual;
  if (v && ["graph", "histogram", "intervals"].includes(v.type) && state.bullets.length) {
    const split = el("div", "split");
    split.append(buildVisual(v), buildBullets(state.bullets));
    content.append(split);
    return content;
  }
  if (v && v.type === "chain") content.append(buildVisual(v));
  if (state.bullets.length) content.append(buildBullets(state.bullets));
  if (v && v.type !== "chain") content.append(buildVisual(v));
  if (state.table) {
    const table = el("table");
    const head = el("tr");
    state.table.headers.forEach(h => head.append(el("th", "", h)));
    table.append(head);
    state.table.rows.forEach(row => {
      const tr = el("tr", row.visible ? (row.current ? "current" : "") : "hidden");
      row.cells.forEach(c => tr.append(el("td", "", c)));
      table.append(tr);
    });
    content.append(table);
  }
  if (state.code) {
    const pre = el("pre", "code");
    state.code.forEach((line, i) => {
      const row = el("div", line.current ? "current" : "");
      row.append(el("i", "", i + 1), document.createTextNode(line.text));
      pre.append(row);
    });
    content.append(pre);
  }
  if (state.grids.length) content.append(buildGrids(state.grids));
  return content;
}

function buildIntro(state, stage) {
  const intro = el("div", "body intro");
  intro.style.display = "block";
  intro.append(el("h2", "", `Chương ${state.chapter}`), el("h1", "", state.chapterTitle), el("p", "", "Hôm nay chúng ta sẽ đi qua:"));
  const agenda = el("div", "agenda");
  const rows = Math.ceil(state.agenda.length / 2);
  agenda.style.gridTemplateRows = `repeat(${rows}, auto)`;
  state.agenda.forEach((item, i) => {
    const row = el("div");
    row.append(el("i", "", String(i + 1).padStart(2, "0")), document.createTextNode(item));
    agenda.append(row);
  });
  intro.append(agenda);
  stage.append(intro);
  return agenda;
}

/* Returns a list of overflow problems (empty = everything fits inside its box). */
function measure(stage, box) {
  const problems = [];
  const frame = stage.getBoundingClientRect();
  if (box.scrollHeight > box.clientHeight + 1) problems.push(`content is ${box.scrollHeight - box.clientHeight}px too tall`);
  if (box.scrollWidth > box.clientWidth + 1) problems.push(`content is ${box.scrollWidth - box.clientWidth}px too wide`);
  const limit = box.getBoundingClientRect();
  const floor = stage.querySelector(".foot").getBoundingClientRect().top;
  if (limit.bottom > floor + 1) problems.push(`content runs ${Math.round(limit.bottom - floor)}px into the footer`);
  for (const node of box.querySelectorAll(".formula, table, pre.code, .grids, .katex-display, .agenda div")) {
    const r = node.getBoundingClientRect();
    if (r.right > limit.right + 1 || r.right > frame.right) problems.push(`${node.className || node.tagName} sticks out ${Math.round(r.right - limit.right)}px to the right`);
    if (node.scrollWidth > node.clientWidth + 1) problems.push(`${node.className || node.tagName} clips ${node.scrollWidth - node.clientWidth}px of its text`);
  }
  const head = stage.querySelector(".head");
  if (head && head.scrollHeight > head.clientHeight + 1) problems.push("title does not fit in two lines");
  return problems;
}

/* Draws one frame. Layout uses every item (hidden ones keep their space), so all frames of a scene share one scale. */
window.renderState = async function (state) {
  const stage = document.getElementById("stage");
  stage.replaceChildren();
  document.documentElement.style.setProperty("--fit", 1);
  stage.append(el("div", "chapter", `CHƯƠNG ${state.chapter} · ${state.chapterTitle.toUpperCase()}${state.unitLabel ? " · " + state.unitLabel : ""}`));
  let box;
  if (state.intro) {
    box = buildIntro(state, stage);
  } else {
    const head = el("div", "head");
    if (state.ask) head.append(el("div", "ask", "? Thử đoán trước"));
    if (state.kicker) head.append(el("div", "kicker", state.kicker), el("br"));
    head.append(el("h1", state.title.length > 52 ? "long" : "", state.title));
    const body = el("div", "body");
    if (state.media) {
      const media = el("div", "media" + (state.wide ? " narrow" : ""));
      const img = el("img");
      img.src = state.media.src;
      media.append(img, el("span", "", state.media.caption));
      body.append(media);
      await img.decode();
    }
    box = buildContent(state);
    body.append(box);
    stage.append(head, body);
  }
  const foot = el("div", "foot");
  const bar = el("div", "bar");
  const done = el("div");
  done.style.width = `${(state.progress * 100).toFixed(2)}%`;
  bar.append(done);
  const right = el("span", "right", state.story ? `${state.kicker || ""} · ${state.sceneIndex + 1}/${state.sceneCount}` : `Phần ${state.sceneIndex + 1}/${state.sceneCount}`);
  foot.append(bar, el("span", "", "nhịp học · IMP302"), right);
  stage.append(foot);

  renderMathInElement(stage, MATH);
  await document.fonts.ready;
  let problems = [];
  for (const step of FIT_STEPS) {
    document.documentElement.style.setProperty("--fit", step);
    drawVisuals(stage);
    problems = measure(stage, box);
    if (!problems.length) return { fit: step, problems };
  }
  return { fit: FIT_STEPS[FIT_STEPS.length - 1], problems };
};
</script>
